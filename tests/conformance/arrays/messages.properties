E_EXPECTED_ARRAY_ELEMENT=配列の{elementIndex}番目には要素が必要です。
E_EXPECTED_ARRAY_END={startLine}行{startColumn}列で始まった配列を閉じる「】」が必要です。
E_UNEXPECTED_ARRAY_END=対応する配列がない「】」です。
E_EXPECTED_ARRAY_ELEMENT_TYPE=配列型には要素型が必要です。
E_EXPECTED_ARRAY_TYPE_END=配列型を閉じる「>」が必要です。
E_ARRAY_ELEMENT_NOT_ALLOWED=配列の{elementIndex}番目の要素式には「{element}」を書けません。
E_ARRAY_ELEMENT_TYPE_REQUIRED=「配列」は要素型を省略できません。
E_EMPTY_ARRAY_TYPE_REQUIRED=「【】」だけでは要素型を決められません。
E_ARRAY_ELEMENT_VALUE_MISSING=配列の{elementIndex}番目の要素式は値を1個作らなければなりません。
E_ARRAY_ELEMENT_VALUE_COUNT=配列の{elementIndex}番目の要素式は値を1個だけ作る必要がありますが、{actualCount}個残ります。
E_ARRAY_ELEMENT_TYPE_MISMATCH=配列の{elementIndex}番目は{expectedType}ではなく{actualType}です。
E_ARRAY_ELEMENT_CALL_NOT_ALLOWED=配列要素式から{callKind}「{word}」を呼ぶことはできません。
E_NESTED_ARRAY_NOT_AVAILABLE=配列では配列の要素を配列にできません。
E_ARRAY_LOOP_INPUT_UNDERFLOW=「各要素について」で反復する配列がありません。
E_ARRAY_LOOP_INPUT_TYPE_MISMATCH=「各要素について」には配列が必要ですが、{actualType}です。
E_ARRAY_INDEX_OUT_OF_BOUNDS=配列の長さは{length}で、有効な添字は{validRange}ですが、{index}が指定されました。
E_ARRAY_RANGE_OUT_OF_BOUNDS=配列の長さは{length}ですが、範囲[{start},{end})は条件{validCondition}を満たしません。
E_ARRAY_LENGTH_LIMIT=配列は{limit}要素までですが、{observed}要素を作ろうとしました。
E_ARRAY_CONSTRUCTION_LIMIT=配列要素の構築は1実行{limit}単位までですが、累計{observed}単位になります。
E_ARRAY_ELEMENT_OPERATION_LIMIT=配列要素の処理は1実行{limit}単位までですが、累計{observed}単位になります。
