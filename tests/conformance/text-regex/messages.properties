E_UNTERMINATED_REGEX_LITERAL=正規表現リテラルが閉じられていません。
E_NEWLINE_IN_REGEX_LITERAL=正規表現リテラルには未エスケープの改行を書けません。
E_REGEX_FLAG=正規表現フラグ「{flag}」は不正または重複しています。
E_REGEX_SYNTAX=正規表現の{patternOffset}番目付近に不正な構文があります。
E_REGEX_UNSUPPORTED_CONSTRUCT=正規表現構文「{token}」は線形時間部分集合に含まれません。
E_REGEX_PATTERN_LIMIT=正規表現パターンはUTF-8で{limit}バイトまでですが、{observed}バイトです。
E_REGEX_CAPTURE_LIMIT=正規表現のキャプチャは{limit}個までですが、{observed}個です。
E_REGEX_PROGRAM_LIMIT=正規表現のコンパイル命令は{limit}個までですが、{observed}個です。
E_STRING_INDEX_OUT_OF_BOUNDS=文字列の書記素位置は0以上{length}未満ですが、{index}です。
E_STRING_RANGE_OUT_OF_BOUNDS=文字列長{length}に対する書記素範囲[{start},{end})は不正です。
E_CODE_POINT_INDEX_OUT_OF_BOUNDS=文字列のコードポイント位置は0以上{length}未満ですが、{index}です。
E_CODE_POINT_RANGE_OUT_OF_BOUNDS=コードポイント数{length}に対する範囲[{start},{end})は不正です。
E_STRING_SEARCH_START_OUT_OF_BOUNDS=文字列検索の開始位置は0以上{length}以下ですが、{index}です。
E_EMPTY_SEARCH_TEXT=「{word}」の検索文字列を空にはできません。
E_EMPTY_DELIMITER=「{word}」の区切り文字列を空にはできません。
E_INTEGER_TEXT_INVALID={inputPreview}は整数の正規入力形式ではありません。
E_DECIMAL_TEXT_INVALID={inputPreview}は小数の正規入力形式ではありません。
E_NUMERIC_TEXT_DIGIT_LIMIT={numericType}への変換は数字{limit}桁までですが、{observed}桁です。
E_STRING_UTF8_LIMIT=「{word}」の文字列結果はUTF-8で{limit}バイトまでですが、{observed}バイトです。
E_REGEX_NO_MATCH=「{word}」では入力に一致する部分がありません。
E_REGEX_GROUP_NOT_FOUND=名前付きキャプチャ「{group}」はパターンにありません。
E_REGEX_GROUP_UNMATCHED=名前付きキャプチャ「{group}」は今回の一致に参加していません。
E_REGEX_REPLACEMENT_TEMPLATE=置換テンプレートの参照「{reference}」は使用できません。
E_REGEX_WORK_LIMIT=正規表現の1呼出し照合単位は{limit}までですが、{observed}です。
E_REGEX_TOTAL_WORK_LIMIT=正規表現の1実行累積照合単位は{limit}までですが、{observed}です。
