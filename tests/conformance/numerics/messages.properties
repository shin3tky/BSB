E_ARRAY_ELEMENT_TYPE_NOT_ALLOWED=数値演算では「{actualType}」を配列の要素型にできません。
E_DIVISION_BY_ZERO=「{word}」では{dividendPreview}を{divisorPreview}で割ることはできません。
E_DIVISION_PRECISION_OUT_OF_RANGE=「精度指定で割る」の精度は{minimum}から{maximum}ですが、{precision}です。
E_DECIMAL_NOT_INTEGER={valuePreview}には小数部があるため、正確に整数へ変換できません。
E_DECIMAL_RESULT_PRECISION_LIMIT=「{word}」の小数結果は有効桁{limit}桁までですが、{observed}桁になります。
E_DECIMAL_SCALE_LIMIT=「{word}」の小数スケール絶対値は{limit}までですが、{observed}になります。
E_NUMERIC_RANGE_INVALID=「{word}」の下限{lowerPreview}は上限{upperPreview}以下でなければなりません。
E_NEGATIVE_EXPONENT=「{word}」の指数は0以上ですが、{exponentPreview}です。
