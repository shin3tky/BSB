E_JSON_SYNTAX=JSONの{jsonLine}行{jsonColumn}列に不正な構文があります（{reason}）。
E_JSON_DUPLICATE_KEY=JSONオブジェクトのキー「{keyPreview}」が重複しています。
E_JSON_NUMBER_LIMIT=JSON数値の{metric}は{limit}までですが、{observed}です。
E_JSON_DEPTH_LIMIT=JSONの入れ子は{limit}段までですが、{observed}段です。
E_JSON_NODE_LIMIT=1個のJSON値は{limit}ノードまでですが、{observed}ノードです。
E_JSON_ARRAY_LENGTH_LIMIT=JSON配列は{limit}要素までですが、{observed}要素を作ろうとしました。
E_JSON_OBJECT_MEMBER_LIMIT=JSONオブジェクトは{limit}メンバーまでですが、{observed}メンバーを作ろうとしました。
E_JSON_KIND_MISMATCH=「{word}」には{expectedKind}が必要ですが、{actualKind}です。
E_JSON_KEY_NOT_FOUND=JSONオブジェクトにキー「{keyPreview}」がありません。
E_JSON_INDEX_OUT_OF_BOUNDS=JSON配列の長さは{length}で、有効な添字は{validRange}ですが、{index}が指定されました。
E_JSON_RANGE_OUT_OF_BOUNDS=JSON配列の長さは{length}ですが、範囲[{start},{end})は条件{validCondition}を満たしません。
E_JSON_OUTPUT_LIMIT=JSON直列化結果は{limit} UTF-8バイトまでですが、{observed}バイトです。
E_JSON_CONSTRUCTION_LIMIT=JSON構築は1実行{limit}単位までですが、累計{observed}単位になります。
E_JSON_WORK_LIMIT=JSON処理は1実行{limit}単位までですが、累計{observed}単位になります。
