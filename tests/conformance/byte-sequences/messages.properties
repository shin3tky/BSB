E_BYTE_SEQUENCE_RANGE_OUT_OF_BOUNDS=「{word}」の範囲[{start}, {end})は、長さ{length}のバイト列に使用できません。
E_BYTE_SEQUENCE_SIZE_LIMIT=「{word}」のバイト列結果は{limit}バイトまでですが、{observed}バイトです。
E_BYTE_SEQUENCE_CONSTRUCTION_LIMIT=バイト列構築は1実行で{limit}バイトまでですが、累積{observed}バイトになります。
E_BYTE_SEQUENCE_WORK_LIMIT=バイト列作業は1実行で{limit}バイトまでですが、累積{observed}バイトになります。
