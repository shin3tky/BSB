E_UNEXPECTED_ELSE=対応する「ならば」がない「さもなければ」です。
E_DUPLICATE_ELSE=同じ条件分岐に「さもなければ」を2回書くことはできません。
E_EXPECTED_IF_END=条件分岐を閉じる「つぎに」が必要です。
E_UNEXPECTED_BLOCK_END=対応する「ならば」がない「つぎに」です。
E_UNEXPECTED_LOOP_END=対応するループがない「繰り返す」です。
E_EXPECTED_LOOP_END={loopKind}ループを閉じる「繰り返す」が必要です。
E_EXPECTED_LOOP_CONDITION_SEPARATOR=条件ループには条件と本体を分ける「続く間」が必要です。
E_UNEXPECTED_LOOP_SEPARATOR=この位置に「続く間」を書くことはできません。
E_SYNTAX_DEPTH_LIMIT=制御構文の入れ子は{limit}段までですが、{observed}段目が現れました。
E_CONDITION_STACK_UNDERFLOW=「ならば」には条件となる真偽値が必要です。
E_CONDITION_TYPE_MISMATCH=「ならば」の条件には真偽が必要ですが、{actualType}が置かれています。
E_BRANCH_STACK_MISMATCH=条件分岐の到達可能な出口でスタックが一致しません。
E_REPEAT_COUNT_UNDERFLOW=「回だけ」には反復回数となる整数が必要です。
E_REPEAT_COUNT_TYPE_MISMATCH=「回だけ」の反復回数には整数が必要ですが、{actualType}が置かれています。
E_LOOP_CONDITION_MISMATCH=条件ループの条件計算部は、基準スタックの上へ真偽を1個だけ積まなければなりません。
E_LOOP_STACK_MISMATCH=ループの{pathKind}でスタックがループ開始時と一致しません。
E_BREAK_OUTSIDE_LOOP=「打ち切る」はループの中でだけ使用できます。
E_CONTINUE_OUTSIDE_LOOP=「続ける」はループの中でだけ使用できます。
E_RETURN_EFFECT_MISMATCH=「{word}」から戻る時のスタックが宣言された出力と一致しません。
E_NEGATIVE_REPEAT_COUNT=反復回数は0以上でなければなりませんが、{count}が指定されました。
W_UNREACHABLE_CODE=「{cause}」の後に実行されない処理があります。
