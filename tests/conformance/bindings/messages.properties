E_DECLARATION_ADJACENCY=宣言名「{name}」と「は」の間に空白を入れることはできません。
E_EXPECTED_DECLARATION_KIND=宣言「{name}」には「定数」または「変数」が必要です。
E_DECLARATION_HEADER_COMMENT_NOT_ALLOWED=宣言名と「定数」または「変数」の間にはコメントを書けません。
E_EXPECTED_DECLARATION_END=宣言「{name}」を閉じる「。」が必要です。
E_UNEXPECTED_DECLARATION_END=対応する宣言がない「。」です。
E_EXPECTED_ASSIGNMENT_VALUE_PARTICLE=変数「{target}」への代入では、対象名の前に「を」が必要です。
E_EXPECTED_ASSIGNMENT_TARGET=「を」の後には代入先の変数名が必要です。
E_EXPECTED_ASSIGNMENT_TARGET_PARTICLE=代入先「{target}」の後には「に」が必要です。
E_INITIALIZER_ELEMENT_NOT_ALLOWED=宣言の初期値には「{element}」を書けません。
E_REFERENCE_BEFORE_INITIALIZATION=「{name}」はまだ初期化されていないため参照できません。
E_REFERENCE_BEFORE_DECLARATION=「{name}」はこの位置より後で宣言されています。
E_BINDING_OUT_OF_SCOPE=「{name}」の宣言はこの位置から参照できるスコープにありません。
E_NAME_SHADOWING=局所名「{name}」は外側の{outerKind}と同じ名前にできません。
E_ASSIGN_TO_CONSTANT=定数「{name}」へ値を入れることはできません。
E_ASSIGNMENT_TARGET_NOT_VARIABLE=「{name}」は{targetKind}であり、代入できる変数ではありません。
E_UNDEFINED_ASSIGNMENT_TARGET=代入先「{name}」という変数は宣言されていません。
E_INITIALIZER_VALUE_MISSING=宣言「{name}」の初期値は値を1個作らなければなりません。
E_INITIALIZER_VALUE_COUNT=宣言「{name}」の初期値は値を1個だけ作る必要がありますが、{actualCount}個残ります。
E_INITIALIZER_CALL_NOT_ALLOWED=宣言の初期値から{callKind}「{word}」を呼ぶことはできません。
E_ASSIGNMENT_STACK_UNDERFLOW=変数「{target}」へ入れる値がありません。
E_ASSIGNMENT_TYPE_MISMATCH=変数「{target}」は{expectedType}ですが、{actualType}を入れることはできません。
E_GLOBAL_BINDING_LIMIT=大域定数・変数は{limit}個までですが、{observed}個目が現れました。
E_LOCAL_BINDING_LIMIT=1単語の局所定数・変数は{limit}個までですが、{observed}個目が現れました。
E_BINDING_LIMIT=1プログラムの定数・変数は{limit}個までですが、{observed}個目が現れました。
