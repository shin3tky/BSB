E_CAPABILITY_UNAVAILABLE=「{word}」に必要な能力{capability}をこの実行環境は提供していません。
E_CAPABILITY_FAILURE=「{word}」の能力{capability}が処理に失敗しました。
E_INPUT_UTF8=入力行のバイト位置{byteOffset}は正しいUTF-8ではありません。
E_INPUT_LINE_LIMIT=入力行はUTF-8で{limit}バイトまでですが、{observed}バイトです。
E_INPUT_TOTAL_LIMIT=1実行の入力は{limit}バイトまでですが、{observed}バイトです。
E_INPUT_RESULT_NOT_LINE=入力結果は行ではなく{state}です。
E_ERROR_OUTPUT_LIMIT=プログラム標準エラーは{limit}バイトまでですが、{observed}バイトです。
E_EXIT_CODE_RANGE=終了コードは0以上255以下ですが、{exitCode}です。
E_ARGUMENT_COUNT_LIMIT=起動引数は{limit}個までですが、{observed}個です。
E_ARGUMENT_TOTAL_LIMIT=起動引数全体はUTF-8で{limit}バイトまでですが、{observed}バイトです。
E_PROGRAM_METADATA_INVALID=プログラム情報{item}は使用できません。
E_WAIT_DURATION_RANGE=待機時間は0以上86400000ミリ秒以下ですが、{milliseconds}です。
E_WAIT_TOTAL_LIMIT=1実行の待機要求は{limit}ミリ秒までですが、{observed}ミリ秒です。
E_WAIT_CANCELLED=待機が実行環境によって取り消されました。
E_DATETIME_RANGE=日時は表現できる範囲外です。
