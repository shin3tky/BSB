E_LOGICAL_CONNECTION_DECLARATION_VALUE=論理接続「{connection}」に初期値は指定できません。
E_LOGICAL_CONNECTION_DECLARATION_SCOPE=論理接続「{connection}」はトップレベルでだけ宣言できます。
E_EXPECTED_LOGICAL_CONNECTION_ARGUMENT_START={word}の直後に静的引数を開始する「<」が必要です。
E_EXPECTED_LOGICAL_CONNECTION_ARGUMENT={word}の第{argumentIndex}引数には論理接続名が必要です。
E_LOGICAL_CONNECTION_ARGUMENT_COUNT={word}には1個の論理接続引数が必要です。
E_EXPECTED_LOGICAL_CONNECTION_ARGUMENT_END=論理接続「{connection}」の静的引数を閉じる「>」が必要です。
E_LOGICAL_CONNECTION_LIMIT=論理接続宣言が上限{limit}個を超えています。
E_UNDECLARED_LOGICAL_CONNECTION=論理接続「{connection}」は宣言されていません。
E_LOGICAL_CONNECTION_REFERENCE_NOT_ALLOWED=論理接続「{connection}」は静的接続引数以外から参照できません。
E_LOGICAL_CONNECTION_NOT_CONFIGURED=論理接続「{connection}」は設定されていません。
E_LOGICAL_CONNECTION_ACCESS_DENIED=論理接続「{connection}」の利用は許可されていません。
E_LOGICAL_CONNECTION_CONFIGURATION_INVALID=論理接続「{connection}」の設定が不正です（{reason}）。
