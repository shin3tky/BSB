E_EXPECTED_HTTP_ARGUMENT_START=「{word}」には静的引数「<接続,method>」が必要です。
E_EXPECTED_HTTP_CONNECTION_ARGUMENT=「{word}」の第{argumentIndex}引数には論理接続名が必要です。
E_EXPECTED_HTTP_METHOD_ARGUMENT=「{word}」の第{argumentIndex}引数にはHTTP methodが必要です。
E_HTTP_ARGUMENT_COUNT=「{word}」の静的引数は{expectedCount}個必要ですが、{actualCount}個です。
E_EXPECTED_HTTP_ARGUMENT_END=「{word}<{connection},{method}」の末尾には「>」が必要です。
E_HTTP_METHOD_INVALID=「{word}」のmethod「{method}」は使用できません。使用可能: {allowedMethods}
E_HTTP_PATH_INVALID=「{word}」の経路は使用できません。理由: {reason}
E_HTTP_PATH_LIMIT=「{word}」の経路は{limit}バイトまでですが、{observed}バイトです。
E_HTTP_QUERY_LIMIT=「{word}」の問い合わせは{limit}までですが、{observed}です。
E_HTTP_HEADER_NAME_INVALID=「{word}」のヘッダー名は使用できません。理由: {reason}
E_HTTP_HEADER_VALUE_INVALID=「{word}」のヘッダー値は使用できません。理由: {reason}
E_HTTP_HEADER_RESERVED=「{word}」では予約ヘッダー「{header}」を設定できません。
E_HTTP_HEADER_LIMIT=「{word}」のヘッダーは{limit}までですが、{observed}です。
E_HTTP_METADATA_CONSTRUCTION_LIMIT=HTTP metadata構築は累積{observed}バイトになり、上限{limit}を超えます。
E_HTTP_TARGET_URI_LIMIT=「{word}」の対象URIは{limit}バイトまでですが、{observed}バイトです。
E_HTTP_METHOD_NOT_ALLOWED=接続「{connection}」ではmethod「{method}」を使用できません。
E_HTTP_BODY_NOT_ALLOWED=method「{method}」では本文を送信できません。
E_HTTP_REQUEST_SIZE_LIMIT=接続「{connection}」への要求本文は{limit}バイトまでですが、{observed}バイトです。
E_HTTP_SEND_LIMIT=HTTP送信は{limit}回までですが、{observed}回目です。
E_HTTP_REQUEST_TOTAL_LIMIT=HTTP要求本文試行は累積{observed}バイトになり、上限{limit}を超えます。
E_HTTP_RESPONSE_TOTAL_LIMIT=HTTP応答本文受信は累積{observed}バイトになり、上限{limit}を超えます。
E_HTTP_AUTHENTICATION_UNSUPPORTED=接続「{connection}」の認証方式「{authenticationKind}」には対応していません。
E_HTTP_CREDENTIAL_NOT_CONFIGURED=接続「{connection}」の資格情報が設定されていません。
E_HTTP_CREDENTIAL_ACCESS_DENIED=接続「{connection}」の資格情報を使用できません。
E_HTTP_CREDENTIAL_INVALID=接続「{connection}」の資格情報は使用できません。理由: {reason}
E_HTTP_CANCELLED=接続「{connection}」へのmethod「{method}」送信が取り消されました。
