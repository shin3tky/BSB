E_WORKSPACE_DECLARATION_VALUE=作業領域宣言「{name}」は値を持てません。
E_WORKSPACE_DECLARATION_SCOPE=作業領域宣言「{name}」はトップレベルにだけ書けます。
E_WORKSPACE_DECLARATION_LIMIT=作業領域宣言が上限{limit}個を超えました。
E_EXPECTED_WORKSPACE_ARGUMENT_START=「{word}」の直後には作業領域引数の「<」が必要です。
E_EXPECTED_WORKSPACE_ARGUMENT=「{word}」の引数には作業領域名が必要です。
E_WORKSPACE_ARGUMENT_COUNT=「{word}」の作業領域引数は{expectedCount}個必要ですが、{actualCount}個あります。
E_EXPECTED_WORKSPACE_ARGUMENT_END=「{word}」の作業領域引数「{workspace}」の後には「>」が必要です。
E_UNDECLARED_WORKSPACE=「{workspace}」は宣言されていない作業領域です。
E_WORKSPACE_REFERENCE_NOT_ALLOWED=作業領域「{workspace}」は通常の値として使えません。
E_LOGICAL_FILE_NAME_INVALID=「{word}」へ渡した論理ファイル名が規則に適合しません（{reason}）。
E_WORKSPACE_NOT_CONFIGURED=作業領域「{workspace}」には{operation}用のホスト設定がありません。
E_WORKSPACE_ACCESS_DENIED=作業領域「{workspace}」の{operation}はホストに拒否されました。
E_WORKSPACE_CONFIGURATION_INVALID=作業領域「{workspace}」のホスト設定が不正です（{reason}）。
E_WORKSPACE_FILE_NOT_MAPPED=作業領域「{workspace}」に{operation}対象の論理ファイル登録がありません。
E_WORKSPACE_FILE_ACCESS_DENIED=作業領域「{workspace}」の論理ファイルは{operation}を許可していません。
E_FILE_OPERATION_LIMIT=ファイル操作が上限{limit}回を超えました。
E_FILE_READ_TOTAL_LIMIT=ファイル読取累積が上限{limit}バイトを超えます。
E_FILE_WRITE_TOTAL_LIMIT=ファイル書込試行累積が上限{limit}バイトを超えます。
E_FILE_CANCELLED=作業領域「{workspace}」の{operation}中に実行が取り消されました。
E_DELIMITED_TEXT_EMPTY_ROW=「{word}」の入力表の{row}行目にはセルがありません。
E_DELIMITED_TEXT_COLUMN_COUNT_MISMATCH=「{word}」の入力表の{row}行目は{expectedCount}セルでなく{actualCount}セルです。
E_DELIMITED_TEXT_CELL_INVALID=「{word}」の入力表の{row}行{column}列のセルが規則に適合しません（{reason}）。
E_DELIMITED_TEXT_OUTPUT_LIMIT=区切りテキスト出力が上限{limit}バイトを超えました。
E_DELIMITED_TEXT_WORK_LIMIT=区切りテキスト作業が上限{limit}を超えます。
